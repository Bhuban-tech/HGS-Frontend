name: HamroGharSewa
description: "A new Flutter project."

# Prevent publishing to pub.dev (since this is private)
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  device_preview: ^1.3.1

 
  http: ^1.2.1

  google_sign_in: ^6.2.1
  file_picker: ^8.1.2
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/Hamro.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/Hamro.png"
    background_color: "#ffffff"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "assets/Hamro.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/Hamro.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/Hamro.png