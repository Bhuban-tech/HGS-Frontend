name: HamroGharSewa
description: "A Flutter authentication application with JWT token management"

# Prevent publishing to pub.dev (since this is private)
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Device Preview for testing
  device_preview: ^1.3.1

  # HTTP & API Communication
  http: ^1.2.1
  dio: ^5.4.0

  # Secure Storage for JWT tokens
  flutter_secure_storage: ^9.0.0

  # JWT decoding
  jwt_decode: ^0.3.1

  # State Management
  provider: ^6.1.1

  # Local Storage
  shared_preferences: ^2.2.2

  # Google Sign In
  google_sign_in: ^6.2.1

  # File Picker
  file_picker: ^8.1.2

  # UI Components
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.10.0

  # WebSocket for real-time chat
  web_socket_channel: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/Hamro.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/Hamro.png"
    background_color: "#ffffff"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "assets/Hamro.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/Hamro.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/Hamro.png
